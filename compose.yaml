services:
  broker:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  logistica:
    build: .
    command: ["./logistica"]
    environment:
      ATR_MQTT_HOST: broker
    depends_on:
      - broker
    volumes:
      - ./logs:/app/logs
    init: true
    stdin_open: true
    tty: true

  interface:
    build: .
    command: ["python", "interface/app.py"]
    environment:
      ATR_MQTT_HOST: broker
      ATR_UI_HOST: 0.0.0.0
    depends_on:
      - broker
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped