services:
  broker:
    image: eclipse-mosquitto:2
    # Porta no host: 1883, ou ATR_PORTA_MQTT se o host já tem um mosquitto
    # nela (ex.: o do WSL). Os containers usam sempre broker:1883.
    ports:
      - "127.0.0.1:${ATR_PORTA_MQTT:-1883}:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  logistica:
    build: .
    command: ["./logistica"]
    environment:
      ATR_MQTT_HOST: broker
      ATR_SEMENTE: ${ATR_SEMENTE:-}   # vazio = semente pela hora atual
      ATR_TEMPO_REAL: ${ATR_TEMPO_REAL:-}  # 1 = SCHED_FIFO Rate Monotonic (tempo_real.c)
    # SYS_NICE: permite pthread_setschedparam(SCHED_FIFO) dentro do container
    cap_add:
      - SYS_NICE
    depends_on:
      - broker
    volumes:
      - ./logs:/app/logs
    init: true
    stdin_open: true
    tty: true

  interface:
    build: .
    command: ["python", "interface/app.py"]
    environment:
      ATR_MQTT_HOST: broker
      ATR_UI_HOST: 0.0.0.0
    depends_on:
      - broker
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped